trigger:
  branches:
    include:
      - Staging
      - master

pool:
  name: ESM

variables:
  repoUrl: 'https://github.com/quadsonn/e08g04t05-odoo17.git'
  updateScript: '/home/is214/deploy-temp/update_code.sh'
  stagePath: '/home/is214/'

stages:
  - stage: Staging
    displayName: Deploy to Staging
    condition: eq(variables['Build.SourceBranchName'], 'Staging')
    jobs:
      - deployment: DeployStaging
        environment: Staging
        strategy:
          runOnce:
            deploy:
              steps:
                - task: SSH@0
                  displayName: "Sync Code - Staging"
                  inputs:
                    sshEndpoint: 'ssh-odoo17-staging'
                    runOptions: commands
                    commands: |
                      set -e
                      echo "Deploying branch: $(Build.SourceBranchName)"
                      cd $(stagePath)
                      rm -rf deploy-temp *-odoo17

                      git clone -b Staging $(repoUrl) --quiet
                      mv *-odoo17 deploy-temp

                      cd deploy-temp
                      rm -f .DS_Store
                      rm -rf .github

                - task: SSH@0
                  displayName: "Run Update Script - Staging"
                  inputs:
                    sshEndpoint: 'ssh-odoo17-staging'
                    runOptions: commands
                    commands: |
                      echo "$(STAGINGUSERPASSWORD)" | sudo -S -p '' chmod +x $(updateScript)
                      echo "$(STAGINGUSERPASSWORD)" | sudo -S -p '' $(updateScript)

  - stage: Production
    displayName: Deploy to Production
    condition: eq(variables['Build.SourceBranchName'], 'master')
    jobs:
      - deployment: DeployProduction
        environment: Production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: SSH@0
                  displayName: "Sync Code - Production"
                  inputs:
                    sshEndpoint: 'ssh-odoo17-prod'
                    runOptions: commands
                    commands: |
                      set -e
                      echo "Deploying branch: $(Build.SourceBranchName)"
                      cd $(stagePath)
                      rm -rf deploy-temp *-odoo17

                      git clone -b master $(repoUrl) --quiet
                      mv *-odoo17 deploy-temp

                      cd deploy-temp
                      rm -f .DS_Store
                      rm -rf .github

                - task: SSH@0
                  displayName: "Uncompress odoo.sql.gz on VM"
                  inputs:
                    sshEndpoint: 'ssh-odoo17-prod'
                    runOptions: commands
                    commands: |
                      set -e
                      cd $(stagePath)deploy-temp/
                      echo "Uncompressing odoo.sql.gz..."
                      gunzip -c $(stagePath)deploy-temp/odoo.sql.gz > $(stagePath)deploy-temp/odoo.sql
                      echo "Uncompress complete: $(stagePath)deploy-temp/odoo.sql"

                - task: SSH@0
                  displayName: "Restore Database"
                  inputs:
                    sshEndpoint: 'ssh-odoo17-prod'
                    runOptions: commands
                    commands: |
                      set -e
                      echo "$(PRODUSERPASSWORD)" | sudo -S -p '' cp /home/is214/deploy-temp/restore_db.sh /tmp/
                      echo "$(PRODUSERPASSWORD)" | sudo -S -p '' cp /home/is214/deploy-temp/odoo.sql /tmp/

                      echo "$(PRODUSERPASSWORD)" | sudo -S -p '' chmod +x /tmp/restore_db.sh
                      echo "$(PRODUSERPASSWORD)" | sudo -S -p '' chmod 644 /tmp/odoo.sql

                      echo "$(PRODUSERPASSWORD)" | sudo -S -p '' -u postgres /tmp/restore_db.sh "odoo17" "odoo" "/tmp/odoo.sql"

                - task: SSH@0
                  displayName: "Run Update Script - Production"
                  inputs:
                    sshEndpoint: 'ssh-odoo17-prod'
                    runOptions: commands
                    commands: |
                      echo "$(PRODUSERPASSWORD)" | sudo -S -p '' chmod +x $(updateScript)
                      echo "$(PRODUSERPASSWORD)" | sudo -S -p '' $(updateScript)